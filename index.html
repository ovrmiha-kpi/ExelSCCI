<!doctype html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1729" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="ExcelCSSI — облік нарядів і робіт за рейтингом з автопризначенням" />
    <title>ExcelCSSI — облік нарядів</title>
    <script>
      try {
        var t = localStorage.getItem('excelcssi:theme') || localStorage.getItem('dutyrank:theme')
        if (t === 'light' || t === 'dark' || t === 'midnight') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
